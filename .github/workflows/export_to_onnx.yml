name: Export PT to ONNX

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_torch.txt
          pip install onnx onnxruntime

      - name: Ensure model directory
        run: mkdir -p models/deploy

      - name: Download model from MODEL_URL (if set)
        if: ${{ secrets.MODEL_URL != '' }}
        env:
          MODEL_URL: ${{ secrets.MODEL_URL }}
        run: |
          echo "Downloading model from MODEL_URL..."
          python - <<'PY'
import os, urllib.request
url = os.environ['MODEL_URL']
out = 'models/deploy/model.pt'
urllib.request.urlretrieve(url, out)
print('Downloaded ->', out)
PY

      - name: Verify checkpoint exists
        run: |
          if [ ! -f models/deploy/model.pt ]; then echo "No checkpoint found at models/deploy/model.pt"; exit 2; fi
          ls -lh models/deploy/

      - name: Export to ONNX
        run: |
          python scripts/export_to_onnx.py --input models/deploy/model.pt --output models/deploy/model.onnx --opset 17

      - name: Upload ONNX artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-onnx
          path: models/deploy/model.onnx
