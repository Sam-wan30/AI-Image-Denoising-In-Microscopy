# Render Blueprint for Flask Production App
services:
  - type: web
    name: neuroscope-denoising
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn application:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: MODEL_PATH
        value: models/deploy/model.onnx
      - key: SECRET_KEY
        generateValue: true
      - key: DEVICE
        value: cpu
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: PORT
        value: "5000"
      - key: MODEL_URL
        sync: false
      - key: QUANTIZE_ONNX
        value: "1"
