# Render Blueprint — free Web Service
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: neuroscope-denoising
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn application:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 180 --log-level info
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MODEL_PATH
        value: models/deploy/model.pt
      - key: SECRET_KEY
        generateValue: true
      - key: DEVICE
        value: cpu
      - key: MAX_UPLOAD_MB
        value: "50"
      # Set in Render dashboard after uploading model to a public URL:
      # - key: MODEL_URL
      #   sync: false
