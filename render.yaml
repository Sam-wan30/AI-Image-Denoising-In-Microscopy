# Render Blueprint — free Web Service
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: neuroscope-denoising
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.2"
      - key: MODEL_PATH
        value: models/deploy/model.onnx
      - key: SECRET_KEY
        generateValue: true
      - key: DEVICE
        value: cpu
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OMP_THREAD_LIMIT
        value: "1"
      - key: QUANTIZE_ONNX
        value: "0"
      # Set in Render dashboard after uploading model to a public URL:
      # - key: MODEL_URL
      #   sync: false
