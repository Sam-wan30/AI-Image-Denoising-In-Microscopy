# Render Blueprint — free Web Service
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: neuroscope-denoising
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn application:app --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 180
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.2"
      - key: MODEL_PATH
        value: models/deploy/model.onnx
      - key: SECRET_KEY
        generateValue: true
      - key: DEVICE
        value: cpu
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OMP_THREAD_LIMIT
        value: "1"
      - key: QUANTIZE_ONNX
        value: "1"
      # Set in Render dashboard after uploading model to a public URL:
      # - key: MODEL_URL
      #   sync: false
